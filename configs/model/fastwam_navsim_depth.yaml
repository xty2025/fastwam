_target_: fastwam.runtime.create_fastwam_depth
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.proprio_dim}
redirect_common_files: true
mot_checkpoint_mixed_attn: true
action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim_3outdim.pt
skip_dit_load_from_pretrain: false

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: "first_frame_causal"
  action_conditioned: false
  action_dim: 3
  action_group_causal_mask_mode: "group_diagonal"
action_dit_config:
  action_dim: 3
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000
action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000
depth_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  out_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  text_dim: 4096
  freq_dim: 256
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  video_attention_mask_mode: "first_frame_causal"
  action_conditioned: false
  action_dim: 3
  action_group_causal_mask_mode: "group_diagonal"
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
depth_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000
depth_experiment:
  # future_denoise: FastWAM baseline, D0 condition -> denoise D1:8.
  # masked_refinement: LingBot-inspired latent block masking on D1:8.
  # hybrid: baseline loss plus the masked-depth loss.
  # rgb_to_depth_perception: GenCeption-inspired zero-depth query -> depth latent.
  mode: future_denoise
  mask_ratio: 0.4
  mask_block_size: 4
  lambda_masked_depth: 1.0
loss:
  lambda_action: 1.0
  lambda_depth: 1.0
