# @package _global_

defaults:
  - override /data: navsim
  - override /model: fastwam_navsim_depth
  - _self_

batch_size: 2
num_workers: 8

model:
  mot_checkpoint_mixed_attn: false

data:
  train:
    video_size: [192, 352]
    camera_layout: front
    generate_flow_gt: false
    generate_flow_rgb: false
    depth_root: ${oc.env:NAVSIM_DEPTH_ROOT}
    depth_metadata_glob: "*"
    depth_alignment_mode: source_path_then_token_then_timestamp
    depth_timestamp_scale: 1.0
    depth_timestamp_tolerance: 0.0
    depth_camera_key: null

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 100
max_steps: null
log_every: 10
save_every: 1000
eval_every: 500

gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
