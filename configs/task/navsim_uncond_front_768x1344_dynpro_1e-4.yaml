# @package _global_

defaults:
  - override /data: navsim
  - override /model: fastwam_navsim
  - _self_

batch_size: 2
num_workers: 4

data:
  train:
    use_dynamic_prompt: true
  # val:
  #   use_dynamic_prompt: true

model:
  mot_checkpoint_mixed_attn: false


lr_scheduler_type: cosine
learning_rate: 1e-4
num_epochs: 5
max_steps: null
log_every: 10
save_every: 1000
eval_every: 250

gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
