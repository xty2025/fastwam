# @package _global_

defaults:
  - override /data: navsim
  - override /model: fastwam_navsim_dit
  - _self_

# FastWAM 6B / Wan2.2 5B
# 3 * 32 * 2 = 192 global batch, matching the 16-GPU config.
batch_size: 3
num_workers: 2
expected_world_size: 32

model:
  mot_checkpoint_mixed_attn: false

data:
  train:
    video_size: [384, 672]
    camera_layout: front
    missing_sensor_policy: ${oc.env:NAVSIM_MISSING_SENSOR_POLICY,skip}
    generate_flow_gt: true
    flow_bev_size: [200, 200]
    flow_resolution: 0.5
    flow_x_range: [0.0, 100.0]
    flow_y_range: [-50.0, 50.0]
    flow_horizon_index: 0
    flow_include_agents: true
    flow_cache_dir: ${oc.env:NAVSIM_FLOW_CACHE_DIR,/mnt/zhaozc_workspace/data/fastwam_xty_dit_flow_dataset_motus_rigid}

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 100
max_steps: 44000
log_every: 10
save_every: 0
save_steps: [3000, 11000, 22000, 33000, 44000]
eval_every: 3000

gradient_accumulation_steps: 2
mixed_precision: "bf16"
max_grad_norm: 1.0
weight_decay: 1e-2
resume: null
